name: Test and build desktop apps
on:
  push:
    branches: [main, work/contact-sheet-0.2]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            label: macOS-Apple-Silicon
            rawpy: 0.27.1
            icon: icns
          - os: macos-15-intel
            label: macOS-Intel
            rawpy: 0.25.1
            icon: icns
          - os: windows-latest
            label: Windows
            rawpy: 0.27.1
            icon: ico
          - os: ubuntu-22.04
            label: Linux
            rawpy: 0.27.1
            icon: png
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: source
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch source into a portable build path
        working-directory: ${{ runner.temp }}
        run: |
          python - <<'PYCODE'
          import os, subprocess
          target = os.path.join(os.environ['RUNNER_TEMP'], 'contact-sheet')
          url = 'https://github.com/' + os.environ['GITHUB_REPOSITORY'] + '.git'
          subprocess.run(['git', 'clone', '--no-checkout', url, target], check=True)
          ref = os.environ.get('PR_HEAD_SHA') or os.environ['GITHUB_SHA']
          subprocess.run(['git', '-C', target, 'fetch', '--depth=1', 'origin', ref], check=True)
          subprocess.run(['git', '-C', target, 'checkout', 'FETCH_HEAD'], check=True)
          PYCODE
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        working-directory: ${{ runner.temp }}/contact-sheet
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb libxcb-cursor0
      - name: Install dependencies
        working-directory: ${{ runner.temp }}/contact-sheet
        run: >-
          python -m pip install --only-binary=:all: -r requirements.txt 'rawpy==${{ matrix.rawpy }}' 'pyinstaller>=6.16,<7'
      - name: Generate application icon
        working-directory: ${{ runner.temp }}/contact-sheet
        run: python make_icon.py
      - name: Test desktop and metadata
        working-directory: ${{ runner.temp }}/contact-sheet
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a python -m unittest discover -s tests -v
          else
            python -m unittest discover -s tests -v
          fi
      - name: Build standalone application
        working-directory: ${{ runner.temp }}/contact-sheet
        run: python -m PyInstaller --noconfirm --clean --windowed --name ContactSheet --icon assets/contact-sheet.${{ matrix.icon }} --add-data "assets:assets" --collect-all rawpy --hidden-import PIL._tkinter_finder --osx-bundle-identifier com.calvertphoto.contactsheet app.py
      - name: Validate and sign macOS application
        if: runner.os == 'macOS'
        working-directory: ${{ runner.temp }}/contact-sheet
        run: |
          APP="dist/ContactSheet.app"
          plutil -lint "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 0.4.0" "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion 4" "$APP/Contents/Info.plist"
          codesign --force --deep --sign - --timestamp=none "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          test -x "$APP/Contents/MacOS/ContactSheet"
          file "$APP/Contents/MacOS/ContactSheet"
      - name: Test macOS Launch Services open
        if: runner.os == 'macOS'
        working-directory: ${{ runner.temp }}/contact-sheet
        run: |
          open "dist/ContactSheet.app"
          sleep 5
          pgrep -fl ContactSheet || true
      - name: Check packaged app starts
        working-directory: ${{ runner.temp }}/contact-sheet
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            dist/ContactSheet.app/Contents/MacOS/ContactSheet --smoke-test
          elif [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a dist/ContactSheet/ContactSheet --smoke-test
          else
            dist/ContactSheet/ContactSheet.exe --smoke-test
          fi
      - name: Archive Mac application
        if: runner.os == 'macOS'
        working-directory: ${{ runner.temp }}/contact-sheet
        run: ditto -c -k --sequesterRsrc --keepParent dist/ContactSheet.app dist/ContactSheet-${{ matrix.label }}.zip
      - name: Archive Windows application
        if: runner.os == 'Windows'
        working-directory: ${{ runner.temp }}/contact-sheet
        run: python -c "import shutil; shutil.make_archive('dist/ContactSheet-Windows','zip','dist','ContactSheet')"
      - name: Archive Linux application
        if: runner.os == 'Linux'
        working-directory: ${{ runner.temp }}/contact-sheet
        run: tar -czf dist/ContactSheet-Linux.tar.gz -C dist ContactSheet
      - uses: actions/upload-artifact@v4
        with:
          name: ContactSheet-${{ matrix.label }}
          path: |
            ${{ runner.temp }}/contact-sheet/dist/*.zip
            ${{ runner.temp }}/contact-sheet/dist/*.tar.gz
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/work/contact-sheet-0.2'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: downloads
      - name: Publish downloadable prototype
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view v0.3.0 >/dev/null 2>&1; then
            gh release create v0.3.0 --target "${{ github.sha }}" --prerelease --title "Contact Sheet 0.3.0" --notes "Multiple selection, Photoshop or other editor handoff, gray interface, contact-sheet icon, and expanded IPTC sections. Download the package for your computer, extract it, and open ContactSheet. No Python installation required. Unsigned prototype; macOS builds are not notarized. Saves metadata to XMP sidecars without rewriting original photos. Batch rename with capture dates and sequence numbers; Photoshop, Photo Craft and other editor options."
          fi
          gh release upload v0.3.0 downloads/ContactSheet-*/* --clobber
